name: Specs

# Per-push CI: the mock-bridge spec suite, on macOS - the platform this shard
# actually targets. A green Linux run would be false confidence for a
# Metal/MLX product (maintainer decision, 2026-07-21). No bridge build here:
# specs use the deterministic in-process mock bridge, so this stays fast.
#
# Cost facts (docs.github.com, billing/concepts/product-billing/github-actions):
# "GitHub Actions usage is free for self-hosted runners and for public
# repositories that use standard GitHub-hosted runners" - macos-latest is a
# standard runner, so this job is $0 on this public repo. NOT free even here:
# larger runners ("Larger runners are always charged for, even when used by
# public repositories"). Free-plan limit: max 5 concurrent macOS jobs. If this
# repo ever goes private, standard macOS bills at $0.062/min - move macOS jobs
# to self-hosted Apple runners (e.g. Tart ephemeral VMs) at that point.
#
# The real-bridge macOS legs (build + on-device inference) live in
# fresh-install-ci.yml and the weekly canary, and run as the release gate
# chain in release.yml.
on:
  push:
    branches: [main, v2-cli-backend]
  pull_request:

jobs:
  spec:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: shards install
        run: shards install
      - name: crystal spec
        run: crystal spec
