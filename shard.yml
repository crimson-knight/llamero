name: llamero
version: 1.0.0

authors:
  - crimson-knight <crimsonknightstudios@gmail.com>

description: |
  A Crystal library for interacting with AI/LLM providers with automatic
  failover and structured output support. Supports OpenAI, Anthropic,
  Groq, and OpenRouter.

crystal: '>= 1.11.2'

license: MIT

targets:
  crystal-training:
    main: src/tools/crystal_training.cr

scripts:
  # Opportunistically builds the PINNED llama.cpp (grammar-constrained
  # structured output) into ~/.llamero/llamacpp/<tag>/. Never fails the
  # install; skipped entirely by `shards install --skip-postinstall` or
  # LLAMERO_SKIP_LLAMACPP=1, in which case the runtime probe fails closed
  # with the manual command. See README "Grammar-constrained structured
  # output".
  postinstall: sh scripts/install_llamacpp.sh --postinstall

dependencies:
  crinja:
    github: straight-shoota/crinja
    version: ~> 0.9.0

development_dependencies:
  webmock:
    github: manastech/webmock.cr
